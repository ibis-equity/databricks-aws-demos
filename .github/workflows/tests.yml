name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest -q --cov-fail-under=55

      - name: Publish coverage summary (PR)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          tree = ET.parse("coverage.xml")
          root = tree.getroot()
          line_rate = float(root.attrib.get("line-rate", 0.0))
          coverage_pct = line_rate * 100
          threshold = 55.0
          passed = coverage_pct >= threshold
          status = "✅ PASS" if passed else "❌ FAIL"
          delta = coverage_pct - threshold
          delta_text = f"{delta:+.2f}%"

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a", encoding="utf-8") as fh:
              fh.write("### Coverage Summary\n")
              fh.write(f"- Status: **{status}**\n")
              fh.write(f"- Total line coverage: **{coverage_pct:.2f}%**\n")
              fh.write("- Required minimum: **55%**\n")
              fh.write(f"- Delta vs minimum: **{delta_text}**\n")
          PY

      - name: Publish coverage comment (PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const xml = fs.readFileSync('coverage.xml', 'utf8');
            const match = xml.match(/line-rate="([0-9.]+)"/);
            const lineRate = match ? parseFloat(match[1]) : 0.0;
            const coveragePct = (lineRate * 100).toFixed(2);
            const threshold = 55;
            const passed = parseFloat(coveragePct) >= threshold;
            const status = passed ? '✅ PASS' : '❌ FAIL';
            const delta = (parseFloat(coveragePct) - threshold).toFixed(2);
            const deltaText = `${delta.startsWith('-') ? '' : '+'}${delta}%`;

            const marker = '<!-- coverage-comment -->';
            const body = `${marker}\n### Coverage Summary\n- Status: **${status}**\n- Total line coverage: **${coveragePct}%**\n- Required minimum: **55%**\n- Delta vs minimum: **${deltaText}**`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

